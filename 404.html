<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Page not found</title>
    <script>
        // Links from earlier semesters point into a semester folder such as /Winter24/.
        const m = window.location.pathname.match(/^(.*?)\/Winter24(\/.*)?$/)
        if (m) {
            window.location.replace(m[1] + (m[2] || "/") + window.location.search + window.location.hash)
        }
    </script>
</head>

<body>
    <p>Page not found. Go to the <a href="/networks-course/">course website</a>.</p>
</body>

</html>
